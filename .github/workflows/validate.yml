name: Validate discovery contracts
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate catalog and evaluation contracts
        run: |
          python3 scripts/validate_metadata.py
          python3 -m unittest discover -s tests -v
          PYTHONPATH=besties/src python3 -m unittest discover -s besties/tests -v
          PYTHONPATH=besties/src python3 -m besties.cli validate besties/examples/truthound/project.json
          PYTHONPATH=besties/src python3 -m besties.cli validate besties/examples/truthound/category-project.json
          python3 scripts/evaluate.py --variant installed --output /tmp/discovery.json
